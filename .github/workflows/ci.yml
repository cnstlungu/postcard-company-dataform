name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  generated:
    name: Generated from the datamart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Regenerate from the pinned datamart release
        run: ./scripts/regenerate.sh

      - name: The committed project is what the pinned versions produce
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The committed project is stale. Run ./scripts/regenerate.sh and commit the result."
            exit 1
          fi

  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Keep in step with dataformCoreVersion in workflow_settings.yaml: older
      # CLIs silently drop config such as onSchemaChange.
      - name: Install Dataform CLI
        run: npm install -g @dataform/cli@3.0.71

      - name: Compile
        run: dataform compile
